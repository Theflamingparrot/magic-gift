<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#c77dff"
    >

    <title>هدية صغيرة 🎁</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>



<body>

    <!-- 🌌 خلفية النجوم -->
    <div class="stars-bg"></div>


    <!-- 🎁 التطبيق -->
    <main class="card">

        <!-- 🎁 الهدية -->
        <div class="gift">
            🎁
        </div>


        <!-- ✨ العنوان -->
        <h1>
            عندي لك حاجة صغيرة ✨
        </h1>


        <p class="subtitle">
            اكتب اسمك وخلي الهدية تبدأ 💖
        </p>


        <!-- ✍️ الاسم -->
        <input
            id="name"
            type="text"
            placeholder="اكتب اسمك هنا..."
            autocomplete="off"
            maxlength="20"
        >


        <!-- 🎁 الزر -->
        <button onclick="showGift()">
            اكتشف الهدية 🎁
        </button>


        <!-- ✨ النتيجة -->
        <section
            id="result"
            aria-live="polite"
        ></section>


        <!-- ✍️ الصانع -->
        <footer class="creator">

            <span>
                صُنعت بكل حب ✨
            </span>

            <strong>
                عبد الرحمن سامح
            </strong>

            <small>
                ♥
            </small>

        </footer>

    </main>


    <script src="script.js"></script>

</body>


</html>
